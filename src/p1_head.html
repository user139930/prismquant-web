<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="PrismQuant 棱镜量化 · 多市场中低频量化与多智能体决策平台">
<title>PrismQuant · 棱镜量化</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2430'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3EP%3C/text%3E%3Ctext x='24' y='15' font-family='Georgia,serif' font-size='11' font-weight='700' fill='%23eb9a86' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1b2430">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
:root{
  --ink:#1b2430;--ink2:#3b4552;--muted:#8a929f;--faint:#a9b0bb;
  --line:#e6e9ee;--line2:#d7dce3;--paper:#fff;--bg:#f4f5f7;--surface:#fafbfc;
  --red:#c8453a;--red-soft:#fbeeec;--red-line:#f0d3ce;
  --green:#1f7a63;--green-soft:#ecf5f2;
  --amber:#a9762b;--amber-soft:#fbf4e8;
  --blue:#2f5d8a;--blue-soft:#eef3f9;
  --violet:#5b4b8a;--violet-soft:#f1eff7;
  --serif:Georgia,"Times New Roman","Songti SC","Noto Serif SC",serif;
  --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:13px/1.6 var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,figure{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums}
.up{color:var(--red)}
.down{color:var(--green)}
.muted{color:var(--muted)}
.micro{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint)}

.topbar{position:sticky;top:0;z-index:40;height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:0 0 auto}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:0;font:700 15px var(--serif);letter-spacing:0}
.brand-mark i{font-style:normal;font-size:.74em;color:#eb9a86;transform:translateY(-3px);margin-left:1px}
.brand-name{font-size:12px;font-weight:700;letter-spacing:2.2px;line-height:1}
.brand-sub{display:block;font-size:10px;letter-spacing:1.1px;color:var(--muted);font-weight:400;margin-top:4px}
.top-mid{display:flex;align-items:center;gap:8px;margin-left:6px;flex:1 1 auto;min-width:0}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.4px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap}
.conn:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.conn.ok{color:var(--green);border-color:#cfe3dd;background:#f4faf7}
.conn.demo{color:var(--amber);border-color:#ecdfc8;background:#fdf9f1}
.conn.bad{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:#fff;font-size:11px;padding:5px 10px;color:var(--muted);letter-spacing:.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.ghost{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;display:grid;place-items:center;font-size:13px;color:#6c7787}
.ghost:hover{border-color:var(--line2);color:var(--ink)}
.plan{font-size:10px;letter-spacing:1.2px;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:3px}

.ticker{display:flex;align-items:stretch;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);height:34px;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tick{display:flex;align-items:center;gap:8px;padding:0 15px;border-right:1px solid var(--line);font-size:11px;white-space:nowrap;letter-spacing:.3px}
.tick .sym{color:#5f6b7a}
.tick b{font:400 12px var(--serif);font-variant-numeric:tabular-nums}
.tick .chg{font:400 10.5px var(--serif);font-variant-numeric:tabular-nums}
.tick-end{margin-left:auto;display:flex;align-items:center;padding:0 15px;font-size:10px;letter-spacing:1px;color:var(--faint);white-space:nowrap;border-left:1px solid var(--line)}

.shell{display:grid;grid-template-columns:211px minmax(0,1fr);align-items:start}
.side{background:#fff;border-right:1px solid var(--line);padding:16px 0 26px;position:sticky;top:92px;height:calc(100vh - 92px);overflow-y:auto}
.navgroup{padding:0 11px;margin-bottom:16px}
.navgroup-t{font-size:10px;letter-spacing:1.5px;color:var(--faint);padding:0 10px;margin-bottom:6px;text-transform:uppercase}
.navlink{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:5px;font-size:12px;color:#5a6472;text-decoration:none;position:relative;line-height:1.4}
.navlink:hover{background:#f7f8fa;color:var(--ink)}
.navlink.active{background:#f3f5f7;color:var(--ink);font-weight:600}
.navlink.active:before{content:"";position:absolute;left:-11px;top:6px;bottom:6px;width:2px;background:var(--red);border-radius:2px}
.navlink .ico{width:15px;text-align:center;font-size:12px;color:#9aa3b0;flex:0 0 auto}
.navlink.active .ico{color:var(--red)}
.navlink .cnt{margin-left:auto;font:400 10px var(--serif);color:var(--faint);background:#f3f5f7;border-radius:999px;padding:0 5px;min-width:16px;text-align:center}
.navlink.active .cnt{background:#fff;color:var(--muted)}
.side-foot{margin-top:26px;padding:14px 16px 0;border-top:1px solid var(--line);color:var(--faint);font-size:10px;line-height:1.8}
.side-foot b{display:block;font-size:10px;letter-spacing:1.6px;color:#b7bdc7;font-weight:400;margin-bottom:6px}

.main{padding:24px 28px 44px;width:100%;max-width:1480px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
.eyebrow{font-size:10px;letter-spacing:2.1px;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.page-title{font-size:22px;font-weight:650;letter-spacing:.4px;line-height:1.35}
.page-sub{font-size:12px;color:var(--muted);margin-top:5px;max-width:62ch}
.head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.head-actions .stamp{font-size:10px;color:var(--faint);white-space:nowrap}

.btn{font-size:11px;padding:6px 11px;border-radius:4px;border:1px solid var(--line2);background:#fff;color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:#b9c0ca}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#243040}
.btn.danger{border-color:var(--red-line);color:var(--red);background:#fff}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{font-size:11px;padding:4px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-link{border:0;background:none;color:var(--blue);font-size:11px;padding:0;text-decoration:underline;text-underline-offset:2px}

.panel{background:#fff;border:1px solid var(--line);border-radius:6px;min-width:0;overflow:hidden}
.panel+.panel{margin-top:14px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);min-height:48px}
.panel-h h2{font-size:13px;font-weight:650;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
.accent{width:3px;height:11px;background:var(--red);flex:0 0 auto}
.panel-h .right{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--faint);white-space:nowrap}
.panel-b{padding:18px}
.panel-b.tight{padding:0}
.legend{display:flex;align-items:center;gap:14px;font-size:10px;color:var(--muted);flex-wrap:wrap}
.legend i{width:14px;height:2px;display:inline-block;margin-right:5px;vertical-align:2px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.stat{padding:15px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .k{font-size:11px;letter-spacing:.5px;color:var(--muted)}
.stat .v{font:400 26px/1.25 var(--serif);font-variant-numeric:tabular-nums;margin-top:3px}
.stat .v small{font-size:11px;color:var(--muted);margin-left:3px}
.stat .d{font-size:10px;color:var(--faint);margin-top:1px}

table.t{width:100%;border-collapse:collapse;font-size:12px}
.t th{font-size:10px;letter-spacing:.7px;color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);text-transform:uppercase}
.t td{padding:11px 14px;border-bottom:1px solid #f1f3f6;vertical-align:middle}
.t tbody tr:last-child td{border-bottom:0}
.t tbody tr:hover{background:#fbfcfd}
.t .r{text-align:right;font-family:var(--serif);font-variant-numeric:tabular-nums;white-space:nowrap}
.t .w{white-space:nowrap}
.t .sym{font-weight:600;letter-spacing:.2px}
.t .sub{font-size:10px;color:var(--faint);margin-top:2px}

.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;letter-spacing:.3px;padding:2px 6px;border-radius:3px;background:#f2f4f7;color:#5f6b7a;white-space:nowrap;line-height:1.5}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.violet{background:var(--violet-soft);color:var(--violet)}
.tag.outline{background:#fff;border:1px solid var(--line2);color:var(--muted)}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block;background:currentColor}

.bar{height:4px;background:#edeff3;border-radius:3px;overflow:hidden;min-width:52px;display:block}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar.warn i{background:var(--amber)}
.bar.bad i{background:var(--red)}
.bar.ok i{background:var(--green)}

.split{display:grid;gap:14px}
.split.c2{grid-template-columns:minmax(0,1.42fr) minmax(300px,1fr)}
.split.c2e{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.split.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split.side{grid-template-columns:minmax(0,1fr) 268px}

.stack{display:flex;flex-direction:column;gap:14px}

.brief p{font-size:15px;line-height:1.95;color:var(--ink2);max-width:40em;text-align:justify;text-justify:inter-ideograph}
.brief p+p{margin-top:14px}
.brief b{font-weight:600;color:var(--ink)}
.brief-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
.byline{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--faint);letter-spacing:.3px}

.rec{display:grid;grid-template-columns:auto 1fr auto;gap:13px;padding:14px 16px;border-bottom:1px solid #f1f3f6;align-items:start}
.rec:last-child{border-bottom:0}
.rec-rank{font:400 11px var(--serif);color:var(--faint);border:1px solid var(--line);width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin-top:1px}
.rec-sym{font-size:13px;font-weight:650;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.rec-name{font-size:11px;color:var(--faint);margin-top:1px}
.rec-thesis{font-size:12px;color:#67707d;line-height:1.75;margin-top:6px}
.rec-thesis em{font-style:normal;color:var(--ink2);border-bottom:1px dotted var(--line2)}
.rec-side{text-align:right;min-width:104px}
.rec-score{font:400 19px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.rec-target{font-size:10px;color:var(--muted);margin-top:3px;font-family:var(--serif)}
.mini-votes{display:flex;gap:3px;margin-top:6px;justify-content:flex-end}
.mini-votes span{width:16px;height:3px;background:#e8ebf0;border-radius:2px}
.mini-votes span.y{background:var(--green)}
.mini-votes span.n{background:var(--red)}

.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl-item{position:relative;padding:0 0 15px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{content:"";position:absolute;left:-17.5px;top:6px;width:6px;height:6px;border-radius:50%;background:#fff;border:1px solid #c3cad4}
.tl-item.hot:before{border-color:var(--red);background:var(--red)}
.tl-time{font:400 10px var(--serif);color:var(--faint);letter-spacing:.3px}
.tl-title{font-size:12px;line-height:1.65;margin-top:2px}
.tl-meta{font-size:10px;color:var(--faint);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.agent-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #f1f3f6}
.agent-row:last-child{border-bottom:0}
.agent-id{font:400 10px var(--serif);letter-spacing:.5px;color:#fff;background:var(--ink);border-radius:3px;padding:2px 5px;flex:0 0 auto}
.agent-name{font-size:12px;font-weight:600}
.agent-desc{font-size:11px;color:var(--faint);margin-top:1px}
.agent-meta{margin-left:auto;margin-right:12px;text-align:right;font-size:10px;color:var(--faint);white-space:nowrap;min-width:52px}
.agent-meta b{display:block;font:400 10.5px var(--serif);color:var(--muted)}

.news-item{display:block;padding:13px 16px;border-bottom:1px solid #f1f3f6;text-decoration:none;color:inherit;position:relative}
.news-item:last-child{border-bottom:0}
.news-item>summary{list-style:none;cursor:pointer;display:block}
.news-item>summary::-webkit-details-marker{display:none}
.news-item>summary::marker{content:''}
.news-item:hover{background:#fbfcfd}
.news-item:hover .news-title{color:var(--red)}
.news-top{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--faint);flex-wrap:wrap}
.news-title{font-size:13px;line-height:1.7;margin-top:5px;font-weight:550;transition:color .12s;padding-right:22px}
.news-sum{font-size:12px;color:#78818e;line-height:1.75;margin-top:4px}
.news-foot{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;padding-right:22px}
.news-item .chev{position:absolute;right:15px;top:15px;color:#b3bcc7;font-size:11px;transition:transform .15s}
.news-item[open] .chev{transform:rotate(180deg)}

.filterbar{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}
.search{flex:1 1 190px;display:flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:4px;padding:0 9px;height:29px;min-width:140px}
.search input{border:0;outline:0;background:none;width:100%;font-size:11px;padding:0}
.search span{color:var(--faint);font-size:12px}
select.sel{border:1px solid var(--line2);background:#fff;border-radius:4px;height:29px;font-size:11px;padding:0 6px;color:#5a6472;max-width:150px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;font-size:11.5px;padding:3px 9px;color:#6c7787}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.person{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:5px;padding:7px 8px;margin-bottom:2px;min-width:0}
.person:hover{background:#f7f8fa}
.person.on{background:#f7f4f2;border-color:#efe3dd}
.pav{width:26px;height:26px;border-radius:50%;background:#e9edf3;color:#54637a;display:grid;place-items:center;font:600 10px var(--serif);flex:0 0 auto}
.pav.all{background:#fbeee9;color:var(--red);font-size:15px;font-weight:400}
.pbody{display:block;min-width:0;flex:1 1 auto;padding:1px 0}
.person .pname{display:block;font-size:12px;font-weight:600;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .psub{display:block;font-size:10px;color:var(--faint);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .pc{margin-left:auto;color:#ccd2da;font-size:12px;flex:0 0 auto}

.rec-list{max-height:calc(100vh - 300px);overflow:auto}
.rec-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #f1f3f6;background:#fff;padding:12px 14px;position:relative}
.rec-item:hover{background:#fbfcfd}
.rec-item.on{background:#fdf7f5;box-shadow:inset 2px 0 0 var(--red)}
.rec-item h4{font-size:11px;line-height:1.65;font-weight:600;padding-right:14px}
.rec-item .mm{font-size:10px;color:var(--faint);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.detail{position:sticky;top:96px;max-height:calc(100vh - 112px);overflow:auto;min-height:420px}
.detail-b{padding:18px}
.detail h2{font-size:15px;line-height:1.6;font-weight:650;margin:10px 0 8px;overflow-wrap:anywhere}
.body-text{font:15px/1.95 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere;color:#3b4552;max-width:38em}
.notice{font-size:11px;line-height:1.85;color:#8a7448;background:#fbf8f1;border-left:2px solid #ddc9a5;padding:7px 10px;margin:12px 0}
.empty{padding:44px 26px;text-align:center;color:#a2a9b4}
.empty .sym{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;font-size:18px;color:#aab2be;margin-bottom:14px}
.empty h4{font-size:12px;color:#7d8795;font-weight:500;margin-bottom:6px}
.empty p{font-size:11px;line-height:1.9}
.rule{height:1px;width:36px;background:var(--line);margin:16px auto}

.chat-wrap{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:14px;align-items:start}
.msgs{max-height:calc(100vh - 330px);min-height:250px;overflow:auto;padding:18px 18px 6px}
.msg{display:flex;gap:10px;margin-bottom:18px}
.mav{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font:600 9.5px var(--serif);flex:0 0 auto;margin-top:1px}
.mav.a5{background:var(--ink);color:#fff}
.mav.me{background:#eef1f5;color:#65717f}
.mbody{min-width:0;flex:1}
.mhead{display:flex;align-items:baseline;gap:7px;font-size:10px;color:var(--faint);margin-bottom:4px}
.mhead b{font-size:11px;color:var(--ink2);font-weight:650}
.mtext{font-size:12px;line-height:1.95;color:#3d4753}
.mtext p{margin:0 0 8px}
.mtext p:last-child{margin-bottom:0}
.mtext ul{margin:6px 0;padding-left:16px}
.mtext li{margin-bottom:4px}
.evidence{margin-top:9px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.evidence summary{cursor:pointer;font-size:10px;color:#6c7787;padding:7px 10px;list-style:none;display:flex;align-items:center;gap:6px}
.evidence summary::-webkit-details-marker{display:none}
.evidence summary:before{content:"▸";font-size:10px;color:#aab2be}
.evidence[open] summary:before{content:"▾"}
.evidence .ev-b{border-top:1px solid var(--line);padding:9px 10px;font:11px/1.8 var(--mono);color:#69727f;white-space:pre-wrap;overflow-x:auto}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface)}
.composer{display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line)}
.composer input{flex:1;border:1px solid var(--line2);border-radius:4px;padding:8px 10px;font-size:12px;outline:0}
.composer input:focus{border-color:#b9c0ca}

.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.heat i{border-radius:2px;display:block;height:34px;cursor:default}
.hmonths{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:4px}
.hmonths span{font:400 8px var(--serif);color:var(--faint);text-align:center}
.hlegend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--faint);margin-top:10px;white-space:nowrap;flex-wrap:nowrap}
.hlegend span{width:9px;height:8px;border-radius:1px;display:inline-block;flex:0 0 auto}
.hlegend em{font-style:normal;margin-left:4px}

.acad-card{display:flex;flex-direction:column;padding:18px;text-decoration:none;color:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;min-height:0}
.acad-card:hover{border-color:var(--line2);box-shadow:0 1px 0 #00000008}
.acad-card h3{font-size:13px;line-height:1.6;font-weight:650;margin:9px 0 6px}
.acad-card p{font-size:11px;color:#7b8492;line-height:1.8}
.acad-card .meta{margin-top:auto;padding-top:12px;font-size:10px;color:var(--faint);display:flex;gap:8px;align-items:center}

.statebar{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 14px;background:#fff;border:1px solid var(--line);border-radius:5px;font-size:10px;color:var(--green);margin-bottom:14px}
.statebar .warn{color:var(--amber)}
.statebar .bad{color:var(--red)}
.statebar span:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}

.footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;font-size:10px;color:var(--faint);flex-wrap:wrap}
.footer b{font-weight:400;letter-spacing:1.2px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a3442;color:#fff;font-size:11px;padding:9px 16px;border-radius:5px;z-index:60;box-shadow:0 6px 24px #0002}
dialog{border:1px solid var(--line);border-radius:8px;padding:0;width:min(430px,calc(100% - 28px));color:var(--ink);font-family:var(--sans)}
dialog::backdrop{background:rgb(27 36 48 / 32%)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:13px;font-weight:650}
.dlg-b{padding:16px}
.dlg-b p{font-size:11px;color:#7b8492;line-height:1.85;margin:0 0 12px}
.dlg-b label{display:block;font-size:11px;margin-bottom:6px}
.dlg-b input{width:100%;border:1px solid var(--line2);border-radius:4px;padding:8px 10px;font-size:12px}
.dlg-f{padding:0 16px 16px;display:flex;justify-content:flex-end;gap:8px}
.err{color:var(--red);font-size:11px;margin-top:8px;min-height:14px}

@media(max-width:1180px){
  .shell{grid-template-columns:184px minmax(0,1fr)}
  .main{padding:20px 18px 36px}
  .split.c2,.split.side{grid-template-columns:minmax(0,1fr)}
  .detail{position:static;max-height:none;min-height:0}
  .rec-list{max-height:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid var(--line)}
  .chat-wrap{grid-template-columns:minmax(0,1fr)}
  .split.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .navgroup{display:flex;gap:4px;padding:0;margin:0}
  .navgroup-t,.side-foot{display:none}
  .navlink{padding:6px 10px;font-size:11px;white-space:nowrap}
  .navlink.active:before{display:none}
  .navlink .cnt{display:none}
  .navlink .ico{display:none}
  .topbar{gap:8px;padding:0 12px;height:52px}
  .brand{gap:7px}
  .brand-mark{width:25px;height:25px;border-radius:6px;font-size:13px}
  .brand-name{font-size:10px;letter-spacing:1.1px}
  .brand-sub{display:none}
  .seg button{padding:4px 7px;font-size:10px}
  .ghost{width:26px;height:26px;font-size:12px;border-radius:5px}
  .top-right{gap:7px}
  .top-mid{display:none}
  .plan{display:none}
  .ticker{height:31px}
  .main{padding:16px 12px 30px}
  .page-head{flex-direction:column;align-items:flex-start;gap:10px}
  .head-actions{justify-content:flex-start;gap:7px}
  .head-actions .stamp{display:none}
  .page-title{font-size:18px}
  .split.c3,.split.c2e{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat{padding:11px 12px}
  .stat .v{font-size:20px}
  .tick{padding:0 10px}
  .rec{grid-template-columns:auto 1fr}
  .rec-side{grid-column:1/-1;text-align:left;display:flex;align-items:center;gap:10px;margin-top:6px}
  .mini-votes{justify-content:flex-start}
}
</style>
</head>
